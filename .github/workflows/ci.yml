name: CI

# Every optional backend is a feature, never a requirement. That is only
# true if the package is exercised without each of them, so the matrix runs
# the suite in every environment the README promises: NumPy alone, the
# science stack, scikit-learn, PyTorch, and everything together with the
# benchmark tools. What a job skips it reports, so a test that quietly
# skips everywhere would show up in the summary.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # Undefined names, unused imports and syntax errors only: the things
      # that are bugs, not style.
      - run: ruff check astrovision tests examples --select F,E9

  test:
    name: ${{ matrix.name }} (py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # -- the four environments the package claims to support ----------
          - name: numpy-only
            python-version: "3.11"
            install: '-e ".[dev]"'
          - name: science
            python-version: "3.11"
            install: '-e ".[science,dev]"'
          - name: ml
            python-version: "3.11"
            install: '-e ".[ml,dev]"'
          - name: deep
            python-version: "3.11"
            install: '-e ".[science,ml,dev]"'
            torch: cpu
          # -- everything, on every supported Python -----------------------
          - name: all
            python-version: "3.9"
            install: '-e ".[all,dev]"'
          - name: all
            python-version: "3.11"
            install: '-e ".[all,dev]"'
          - name: all+benchmark
            python-version: "3.12"
            install: '-e ".[all,benchmark,alerts,dev]"'
          # -- the floor -----------------------------------------------------
          # The oldest NumPy the package claims to support. Without this the
          # floor in pyproject.toml is a promise nothing checks -- it was
          # broken once by `np.trapezoid`, which exists only on 2.x.
          # Pinned on 3.9 because NumPy 1.21 has no wheels for anything newer.
          - name: numpy-1.21
            python-version: "3.9"
            install: '-e ".[dev]"'
            numpy: "1.21.6"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ${{ matrix.install }}

      - name: Pin the oldest supported NumPy
        if: matrix.numpy != ''
        run: pip install "numpy==${{ matrix.numpy }}"

      - name: Install PyTorch (CPU)
        if: matrix.torch == 'cpu'
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Show which backends are active
        run: astrovision info

      - name: Run the test suite
        run: pytest tests/ -q --durations=10 -rs

      - name: Run the doctests
        if: startsWith(matrix.name, 'all')
        run: pytest --doctest-modules astrovision/ -q --ignore=astrovision/cli

      - name: Smoke-test the command line
        run: |
          astrovision simulate --out /tmp/field.fits --size 128 --stars 20 \
            --galaxies 5 --nebulae 0 --clusters 0 --lenses 0 --anomalies 0
          astrovision inspect /tmp/field.fits
          astrovision --log-level error analyze /tmp/field.fits \
            -o /tmp/out --report text,json
          test -s /tmp/out/report.txt
          test -s /tmp/out/catalog.csv

  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"
      - name: Field analysis example
        run: python examples/01_analyse_a_field.py --size 192 --out /tmp/example
      - name: Transient search example
        run: python examples/02_transient_search.py --size 192 --epochs 4 --transients 2
