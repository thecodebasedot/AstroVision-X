name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} (${{ matrix.extras }}${{ matrix.numpy && format(', numpy {0}', matrix.numpy) || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
        extras: ["all"]
        include:
          # NumPy alone must still work: every optional backend is a feature,
          # never a requirement.
          - python-version: "3.11"
            extras: "minimal"
          # The oldest NumPy the package claims to support.  Without this the
          # floor in pyproject.toml is a promise nothing checks -- and it was
          # broken by a call to `np.trapezoid`, which exists only on 2.x while
          # `np.trapz`, the name it replaced, exists only on 1.x.
          #
          # Pinned on 3.9 because NumPy 1.21 has no wheels for 3.11: the
          # oldest supported NumPy can only be exercised on a Python old
          # enough to install it.
          - python-version: "3.9"
            extras: "minimal"
            numpy: "1.21.6"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (minimal)
        if: matrix.extras == 'minimal'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pin the oldest supported NumPy
        if: matrix.numpy != ''
        run: pip install "numpy==${{ matrix.numpy }}"

      - name: Install (all extras)
        if: matrix.extras == 'all'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: Show which backends are active
        run: astrovision info

      - name: Run the test suite
        run: pytest tests/ -q --durations=10

      - name: Run the doctests
        run: pytest --doctest-modules astrovision/ -q --ignore=astrovision/cli

      - name: Smoke-test the command line
        run: |
          astrovision simulate --out /tmp/field.fits --size 128 --stars 20 \
            --galaxies 5 --nebulae 0 --clusters 0 --lenses 0 --anomalies 0
          astrovision inspect /tmp/field.fits
          astrovision --log-level error analyze /tmp/field.fits \
            -o /tmp/out --report text,json
          test -s /tmp/out/report.txt
          test -s /tmp/out/catalog.csv

  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"
      - name: Field analysis example
        run: python examples/01_analyse_a_field.py --size 192 --out /tmp/example
      - name: Transient search example
        run: python examples/02_transient_search.py --size 192 --epochs 4 --transients 2
